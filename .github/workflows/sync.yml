name: Sync Dasheng Data

on:
  schedule:
    # UTC 0:00-14:00 = Beijing 8:00-22:00, every 30 minutes
    - cron: '0,30 0-14 * * *'
  workflow_dispatch:
    inputs:
      sdate:
        description: '分媒体拉取起始日期 YYYY-MM-DD（留空=近 7 天）'
        required: false
      edate:
        description: '分媒体拉取结束日期 YYYY-MM-DD（留空=今天）'
        required: false

concurrency:
  group: sync-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync script
        run: python scripts/sync.py
        env:
          DASHENG_TOKEN: ${{ secrets.DASHENG_TOKEN }}

      # 分媒体消耗（api/2617）：供看板「跨媒体选剧」视图使用；失败不阻断主数据同步
      - name: Fetch media split (api/2617)
        continue-on-error: true
        run: python scripts/fetch_media_split.py
        env:
          DASHENG_TOKEN: ${{ secrets.DASHENG_TOKEN }}
          SDATE: ${{ inputs.sdate }}
          EDATE: ${{ inputs.edate }}

      # 新媒体短剧榜单（reinvest/list · source=tencent）：提供首日投放日期与榜单消耗
      - name: Fetch reinvest list (ztdoc)
        continue-on-error: true
        run: python scripts/fetch_reinvest.py --sdate "$SDATE" --edate "$EDATE"
        env:
          SDATE: ${{ inputs.sdate }}
          EDATE: ${{ inputs.edate }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "sync: update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push

      - name: Purge jsDelivr CDN cache
        if: success()
        run: |
          echo "Purging CDN cache..."
          for f in meta.json latest.json part1.json part2.json media_split.json reinvest_tencent.json; do
            curl -sf "https://purge.jsdelivr.net/gh/lly266/dasheng-data@main/data/$f" || true
            curl -sf "https://purge.jsdelivr.net/gh/lly266/dasheng-data@main/data/merged/$f" || true
          done
          echo "Waiting for CDN propagation..."
          sleep 10
          for f in meta.json latest.json part1.json part2.json media_split.json reinvest_tencent.json; do
            curl -sf "https://purge.jsdelivr.net/gh/lly266/dasheng-data@main/data/$f" || true
            curl -sf "https://purge.jsdelivr.net/gh/lly266/dasheng-data@main/data/merged/$f" || true
          done
          echo "CDN cache purged."
